# Render Blueprint for SpeedSpot Mapper (https://render.com/docs/blueprint-spec).
# Values checked against Render's schema: https://render.com/schema/render.yaml.json
#
# COST: the web service can run on the free plan, but the database must persist, so it
# uses a paid Render Postgres plan (basic-256mb). Render's FREE Postgres is deleted 30 days
# after creation and has no backups, so it is not suitable for real pilot data.
# See docs/DEPLOYMENT.md before applying this Blueprint.

databases:
  - name: speedspot-db
    plan: basic-256mb
    region: singapore           # closest Render region to India
    databaseName: speedspot
    postgresMajorVersion: "16"
    ipAllowList: []             # no public access; only Render services in this account

services:
  - type: web
    name: speedspot-mapper
    runtime: python
    plan: free                  # spins down after 15 min idle (~1 min cold start); use "starter" to avoid
    region: singapore
    healthCheckPath: /api/health
    buildCommand: >-
      pip install -r requirements.txt &&
      (python scripts/download_asn_db.py || echo "WARNING: ASN database unavailable; provider detection will report 'unknown'") &&
      python -m whitenoise.compress frontend/static
    # Migrations + reference data are idempotent, so they run on every start.
    startCommand: flask init-db && gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: SPEEDSPOT_ENV
        value: production
      - key: FLASK_APP
        value: backend
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: speedspot-db
          property: connectionString
      # Render's load balancer adds one X-Forwarded-For hop. Verify after deploy (docs/DEPLOYMENT.md).
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
